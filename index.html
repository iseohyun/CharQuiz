<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CharQuiz</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    window.APP_VERSION = "v1.0.5";
    // 이 앱이 따르는 QuizApp Common GUI 판 (iseohyun.com 의 column/ai/quizapp-common-gui). 도움말 맨 아래에 보여 준다
    window.QUIZAPP_GUI_VERSION = "v0.2.0";
    window.CACHE_BUST = "20261119v13";

    const cssLink = document.createElement("link");
    cssLink.rel = "stylesheet";
    cssLink.href = `common.css?v=${window.CACHE_BUST}`;
    document.head.appendChild(cssLink);

    // ES 모듈 캐시 버스팅: main.js 뿐 아니라 components/*.js 에도 ?v=CACHE_BUST 를 붙인다.
    // 새 main.js 와 캐시된 옛 컴포넌트가 섞여 "does not provide an export named ..." 로 앱이 멈추는 것을 막는다.
    // ⚠️ components/ 에 모듈을 추가하면 아래 목록에도 추가할 것 (.agents/rules/project_architecture.md 참고)
    (function registerVersionedImportMap() {
      const componentModules = [
        "app-config", "audio-manager", "auth-handler", "combo-fx", "date-utils", "db-handler", "engine",
        "firebase-config", "hint-handler", "hint-seeds", "i18n", "install-prompt", "keybind-manager", "legacy-migration", "letter-stage", "new-dot", "notification-handler", "notification-inbox", "season-weather", "sister-apps", "storage-migration",
        "store", "ui-modal-handler", "update-checker"
      ];
      const imports = {};
      componentModules.forEach((name) => {
        const moduleUrl = new URL(`./components/${name}.js`, document.baseURI).href;
        imports[moduleUrl] = `${moduleUrl}?v=${window.CACHE_BUST}`;
      });
      const importMapScript = document.createElement("script");
      importMapScript.type = "importmap";
      importMapScript.textContent = JSON.stringify({ imports });
      document.head.appendChild(importMapScript);
    })();
  </script>
</head>

<body>
  <div id="app-container">
    <!-- 사용자 원본 모바일 탑메뉴 UI 구조 -->
    <div class="user-profile-box">
      <div class="user-info-left">
        <div class="menu-item profile-trigger-item" onclick="popupLogin()">
          <span class="user-name-trigger">
            <span class="material-symbols-outlined" id="header-auth-icon">account_box</span>
            <span id="header-provider-chip" class="header-provider-chip hidden" aria-hidden="true"></span>
            <span id="profile-name">게스트</span><span data-i18n="header.suffix">님</span>
          </span>
          <span class="keybind-badge" id="kb-badge-popupLogin">ESC</span>
        </div>
      </div>

      <!-- 🎮 퀴즈/게임 모드 실행 시 상단 헤더 빈 영역에 노출되는 모드 배지 및 컨트롤 -->
      <div class="header-quiz-control" id="header-quiz-control" style="display: none;">
        <div class="mode-badge study" id="header-mode-badge">
          <span class="material-symbols-outlined mode-badge-icon" style="font-size: 1.1rem;">school</span>
          <span id="current-mode-title">학습 모드</span>
        </div>
        <button class="pause-btn" id="header-pause-btn" onclick="pauseGameTrigger()" aria-label="일시정지" title="일시정지">
          <span class="material-symbols-outlined" style="font-size: 1.3rem;">pause</span>
        </button>
        <button class="stop-btn" id="header-stop-btn" onclick="exitQuizTrigger()" aria-label="중단" title="중단">
          <span class="material-symbols-outlined" style="font-size: 1.3rem;">close</span>
        </button>
      </div>

      <div class="user-info-right">
        <div class="menu-item" onclick="popupLeaderboard()" data-tooltip="리더보드" data-i18n-title="menu.leaderboard">
          <span class="material-symbols-outlined">leaderboard</span>
          <span class="keybind-badge" id="kb-badge-popupLeaderboard">5</span>
        </div>
        <div class="menu-item" onclick="popupProgress()" data-tooltip="단어장" data-i18n-title="menu.progress">
          <span class="material-symbols-outlined">menu_book</span>
          <span class="keybind-badge" id="kb-badge-popupProgress">3</span>
          <span id="review-count-badge" class="review-count-badge" style="display: none;"></span>
        </div>
        <div class="menu-item" onclick="toggleDomain()" data-tooltip="일본어 → 한국어 → 영어 전환" data-i18n-title="menu.toggleDomain">
          <span class="domain-btn">あ</span>
          <span class="keybind-badge" id="kb-badge-toggleDomain">1</span>
        </div>
        <div class="menu-item" onclick="popupSetting()" data-tooltip="설정" data-i18n-title="menu.setting">
          <span class="material-symbols-outlined">settings</span>
          <span id="setting-new-dot" class="setting-new-dot" hidden></span>
          <span class="keybind-badge" id="kb-badge-popupSetting">4</span>
        </div>
      </div>
    </div>

    <div id="main-box">
      <div id="mode-selection-layer" class="mode-selection">
        <button class="mode-btn mode-study" onclick="startSessionWorkflow('study')">
          <div class="mode-btn-content">
            <span class="material-symbols-outlined mode-icon">menu_book</span>
            <span class="mode-title" data-i18n="mode.study">학습 모드</span>
            <span class="mode-desc" data-i18n="mode.studyDesc">반복 오디오 퀴즈로 가나 익히기</span>
          </div>
          <span class="keybind-badge" id="kb-badge-startStudy">Q</span>
        </button>

        <div class="mode-btn mode-record mode-split">
          <button type="button" class="mode-split-half" onclick="startSessionWorkflow('record')">
            <span class="material-symbols-outlined mode-split-icon">timer</span>
            <span class="mode-split-title" data-i18n="mode.record20">20문제 타임어택</span>
            <span class="keybind-badge" id="kb-badge-startRecord">W</span>
          </button>
          <button type="button" class="mode-split-half" onclick="startSessionWorkflow('timeattack')">
            <span class="material-symbols-outlined mode-split-icon">avg_pace</span>
            <span class="mode-split-title" data-i18n="mode.record30">30초 타임어택</span>
          </button>
        </div>

        <button class="mode-btn mode-spectator" onclick="startSessionWorkflow('spectator')">
          <div class="mode-btn-content">
            <span class="material-symbols-outlined mode-icon">visibility</span>
            <span class="mode-title" data-i18n="mode.spectator">관전 모드</span>
            <span class="mode-desc" data-i18n="mode.spectatorDesc">자동 재생으로 편안하게 복습</span>
          </div>
          <span class="keybind-badge" id="kb-badge-startSpectator">E</span>
        </button>

        <div class="mode-info-card domain-summary" id="domain-summary"></div>
      </div>
    </div>
  </div>

  <script>
    const mainScript = document.createElement("script");
    mainScript.type = "module";
    mainScript.src = `./main.js?v=${window.CACHE_BUST || window.APP_VERSION}`;
    document.body.appendChild(mainScript);
  </script>
</body>

</html>
