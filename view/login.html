<!-- 사용자 계정 & 소셜 로그인 모달 뷰 (스타일은 common.css 에서 중앙 관리) -->
<div id="auth-modal-root" class="auth-modal-container">
  <!-- 비로그인(게스트) 상태 화면 -->
  <div id="auth-guest-view" class="auth-view-section">
    <div class="auth-guest-banner">
      <span class="material-symbols-outlined auth-guest-icon">cloud_sync</span>
      <div class="auth-guest-text">
        <strong>간편 로그인으로 학습 기록 보관</strong>
        <p>로그인하면 모든 기기에서 단어장 진도와 설정이 자동으로 동기화됩니다.</p>
      </div>
    </div>

    <div class="auth-btn-group">
      <button type="button" class="social-login-btn social-google" data-provider="google" onclick="googleLogin()">
        <span class="social-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
          </svg>
        </span>
        <span class="social-btn-label">Google로 계속하기</span>
      </button>

      <button type="button" class="social-login-btn social-kakao" data-provider="kakao" onclick="kakaoLogin()">
        <span class="social-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#191919" d="M12 3C6.48 3 2 6.52 2 10.86c0 2.79 1.86 5.25 4.66 6.64-.15.54-.96 3.47-1 3.63-.06.25.09.25.2.18.08-.05 3.23-2.19 3.76-2.55.77.11 1.56.17 2.38.17 5.52 0 10-3.52 10-7.86S17.52 3 12 3z"/>
          </svg>
        </span>
        <span class="social-btn-label">카카오로 계속하기</span>
      </button>

      <button type="button" class="social-login-btn social-naver" data-provider="naver" onclick="naverLogin()">
        <span class="social-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#FFFFFF" d="M16.27 12.85L7.37 0H0v24h7.73V11.15L16.63 24H24V0h-7.73v12.85z"/>
          </svg>
        </span>
        <span class="social-btn-label">네이버로 계속하기</span>
      </button>
    </div>
  </div>

  <!-- 로그인 완료 상태 화면 -->
  <div id="auth-user-view" class="auth-view-section hidden">
    <div class="auth-account-card">
      <div class="auth-status-row">
        <span class="auth-status-pill">
          <span class="auth-status-dot"></span>
          로그인됨
        </span>
        <span id="auth-provider-badge" class="auth-provider-badge">Google</span>
      </div>

      <div class="auth-profile-row">
        <div id="auth-avatar-box" class="auth-avatar-box">
          <span class="material-symbols-outlined">person</span>
        </div>
        <div class="auth-profile-meta">
          <div id="auth-user-name" class="auth-user-name">사용자</div>
          <div id="auth-user-email" class="auth-user-email"></div>
        </div>
      </div>

      <div class="auth-sync-note">
        <span class="material-symbols-outlined" style="font-size: 16px;">verified_user</span>
        <span>이 계정으로 학습 진도와 설정이 자동 동기화됩니다.</span>
      </div>
    </div>

    <button type="button" class="auth-logout-btn" onclick="logout()">
      <span class="material-symbols-outlined" style="font-size: 19px;">logout</span>
      <span>로그아웃</span>
    </button>
  </div>
</div>
