<!-- 설정 화면: 네 묶음을 접고 펼친다. 줄마다 왼쪽은 설정 이름, 오른쪽은 설정 값. 글자는 components/i18n.js 의 키로 바뀐다. -->
<details class="setting-group" open>
  <summary class="setting-group-head">
    <span data-i18n="setting.groupUser">사용자</span>
    <span class="material-symbols-outlined setting-group-chev" aria-hidden="true">expand_more</span>
  </summary>
  <div class="setting-row">
    <span class="setting-label" data-i18n="setting.account">계정</span>
    <span class="setting-value setting-account">
      <strong>{{userName}}</strong>
      <small>{{userEmail}}</small>
    </span>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="user-age" data-i18n="setting.age">연령대</label>
    <select id="user-age" class="setting-select">
      <option value="미상" data-i18n="setting.unknown">선택 안 함</option>
      <option value="10대" data-age="10">10대</option>
      <option value="20대" data-age="20">20대</option>
      <option value="30대" data-age="30">30대</option>
      <option value="40대" data-age="40">40대</option>
      <option value="50대" data-age="50">50대</option>
      <option value="60대" data-age="60">60대</option>
      <option value="70대" data-age="70">70대</option>
    </select>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="user-gender" data-i18n="setting.gender">성별</label>
    <select id="user-gender" class="setting-select">
      <option value="미상" data-i18n="setting.unknown">선택 안 함</option>
      <option value="남" data-i18n="setting.male">남</option>
      <option value="여" data-i18n="setting.female">여</option>
    </select>
  </div>
</details>

<details class="setting-group" open>
  <summary class="setting-group-head">
    <span data-i18n="setting.groupPersonal">개인화 설정</span>
    <span class="material-symbols-outlined setting-group-chev" aria-hidden="true">expand_more</span>
  </summary>
  <div class="setting-row">
    <label class="setting-label" for="time-slider" data-i18n="setting.learningTime">1회당 학습 시간</label>
    <span class="setting-value setting-range">
      <input type="range" id="time-slider" min="0" max="5" step="1" value="{{timeIdx}}"
        oninput="updateTimeFromSlider(this.value)">
      <span class="setting-range-val"><span id="time-val-display">{{learningTime}}</span><span data-i18n="setting.seconds">초</span></span>
    </span>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="pool-size" data-i18n="setting.poolSize">1회당 문제 수</label>
    <input type="number" id="pool-size" class="setting-number" min="1" max="100" value="{{MAX_POOL_SIZE}}">
  </div>
  <div class="setting-row">
    <label class="setting-label" for="auto-progress" data-i18n="setting.autoProgress">자동 진도</label>
    <input type="checkbox" id="auto-progress" class="setting-check" {{#if autoProgress}}checked{{/if}}>
  </div>
</details>

<details class="setting-group" open>
  <summary class="setting-group-head">
    <span data-i18n="setting.groupSystem">시스템</span>
    <span class="material-symbols-outlined setting-group-chev" aria-hidden="true">expand_more</span>
  </summary>
  <div class="setting-row">
    <label class="setting-label" for="ui-language" data-i18n="setting.language">언어</label>
    <select id="ui-language" class="setting-select">{{languageOptions}}</select>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="speech-slider" data-i18n="setting.speechRate">음성 속도</label>
    <span class="setting-value setting-range">
      <input type="range" id="speech-slider" min="0" max="5" step="1" value="{{speechIdx}}"
        oninput="updateSpeechFromSlider(this.value)">
      <span class="setting-range-val"><span id="speech-val-display">{{speechRate}}</span>×</span>
    </span>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="weather-theme" data-i18n="setting.weatherTheme">날씨 반영</label>
    <input type="checkbox" id="weather-theme" class="setting-check" {{#if weatherTheme}}checked{{/if}}>
  </div>
  <p class="setting-hint" data-i18n="setting.weatherThemeHint">처음 화면의 계절 무대에 접속 위치(IP)로 짐작한 지금 날씨를 겹칩니다. 끄면 위치를 묻지 않습니다.</p>
  <div class="setting-row">
    <span class="setting-label" data-i18n="setting.soundTest">소리 테스트</span>
    <button type="button" id="setting-sound-test" class="setting-play-btn">
      <span class="material-symbols-outlined" aria-hidden="true">volume_up</span>
      <span data-i18n="setting.play">듣기</span>
    </button>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="voice-source" data-i18n="setting.voice">음성 모델</label>
    <select id="voice-source" class="setting-select setting-select-wide">
      <option value="google_mp3">🎵 구글 여성 성우 (Female MP3)</option>
      <option value="google_male_mp3">👨‍💼 구글 남성 성우 (Male MP3)</option>
      <option value="haruka_mp3">🌸 Windows Haruka (Haruka MP3)</option>
      <option value="browser_tts">🎙️ 브라우저 실시간 TTS</option>
    </select>
  </div>
  <div class="setting-row setting-notify-row">
    <span class="setting-label" data-i18n="setting.reminder">복습 알림</span>
    <div class="setting-notify-ctrl">
      <span id="notify-status" class="setting-notify-status"></span>
      <button id="btn-notify-enable" type="button" class="setting-notify-btn" hidden>권한 허용</button>
      <input type="checkbox" id="review-reminder" class="setting-check" aria-label="복습 알림 받기">
    </div>
  </div>
  <p id="notify-last" class="setting-notify-last" hidden></p>
  <div class="setting-row">
    <span class="setting-label" data-i18n="setting.errorFeedback">오답 표시 방법</span>
    <div class="setting-value setting-btn-pair">
      <button id="btn-error-show" type="button" class="setting-toggle-btn">표시</button>
      <button id="btn-error-audio" type="button" class="setting-toggle-btn">+ 음성</button>
    </div>
  </div>
  <div class="setting-row">
    <label class="setting-label" for="spectator-interval" data-i18n="setting.spectatorInterval">관전 모드 주기</label>
    <select id="spectator-interval" class="setting-select">
      <option value="0.8">0.8s</option>
      <option value="1">1s</option>
      <option value="1.5">1.5s</option>
      <option value="2">2s</option>
      <option value="2.5">2.5s</option>
      <option value="3">3s</option>
    </select>
  </div>
</details>

<details class="setting-group">
  <summary class="setting-group-head">
    <span data-i18n="setting.groupKeys">단축키</span>
    <span class="material-symbols-outlined setting-group-chev" aria-hidden="true">expand_more</span>
  </summary>
  <div class="setting-keys">{{keybindingsConfig}}</div>
</details>
